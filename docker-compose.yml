# Środowisko DEV: baza PostgreSQL + aplikacja.
# Start:  docker compose up --build
# Stop:   docker compose down        (dane zostają)
# Reset:  docker compose down -v     (kasuje bazę - przy kolejnym starcie wgrają się dane testowe)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk_dev   # hasło tylko dla DEV
    ports:
      - "5433:5432"                     # baza widoczna na Macu/PC pod localhost:5433 (5433, żeby nie gryzło się z lokalnym Postgresem)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: postgres://helpdesk:helpdesk_dev@db:5432/helpdesk
      SESSION_SECRET: dev-sekret-zmien-na-produkcji
      COOKIE_SECURE: "false"            # na DEV nie ma HTTPS
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
